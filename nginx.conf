# Langue préférée du navigateur pour la page d'accueil (fr si Accept-Language commence par fr)
map $http_accept_language $preferred_lang {
    default en;
    ~*^fr   fr;
}

# En-têtes par chemin (une valeur vide = en-tête non envoyé)
map $uri $cache_control {
    default    "";
    /          "no-cache";
    ~^/_astro/ "public, max-age=31536000, immutable";
}
map $uri $vary_lang {
    default "";
    /       "Accept-Language";
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirections relatives : pas de http:// ni de port interne derrière un reverse proxy
    absolute_redirect off;

    # Security headers to enforce HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control $cache_control always;
    add_header Vary $vary_lang always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Remplace l'ancienne page de redirection HTML
    location = / {
        return 302 /$preferred_lang/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
