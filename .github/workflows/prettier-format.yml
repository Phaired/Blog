name: Prettify Code

on:
  pull_request:

jobs:
  prettify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Prettier
        run: |
          bun install --frozen-lockfile
          bunx prettier --write **/*.{js,md,astro,ts} --tab-width 4

      - uses: EndBug/add-and-commit@v11
        with:
          add: "src"
          author_name: Prettier
          default_author: github_actions
          fetch: false
          message: "Prettying"
